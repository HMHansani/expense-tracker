<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expense Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="container">
    <header class="top">
  <h1>Expense Tracker</h1>
  <button type="button" id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
</header>
    <!-- Summary -->
    <section class="card summary">
      <p>Total spent</p>
      <h2 id="total">LKR 0.00</h2>
    </section>

    <!-- Add expense form -->
    <section class="card">
      <h3>Add expense</h3>
      <form id="expense-form">
        <input type="text" id="title" placeholder="Title (e.g. Groceries)" required />
        <input type="number" id="amount" placeholder="Amount (LKR)" min="0" step="0.01" required />
        <select id="category" required>
          <option value="">Select category</option>
          <option>Food</option>
          <option>Transport</option>
          <option>Bills</option>
          <option>Shopping</option>
          <option>Entertainment</option>
          <option>Other</option>
        </select>
        <input type="date" id="date" required />
        <button type="submit">Add</button>
      </form>
      <p id="error" class="error"></p>
    </section>

    <!-- Filters -->
    <section class="card filters">
      <select id="filter-category">
        <option value="all">All categories</option>
        <option>Food</option>
        <option>Transport</option>
        <option>Bills</option>
        <option>Shopping</option>
        <option>Entertainment</option>
        <option>Other</option>
      </select>
      <input type="month" id="filter-month" />
    </section>

    <!-- Expense list -->
    <section class="card">
      <h3>Expenses</h3>
      <ul id="expense-list"></ul>
      <p id="empty-message">No expenses yet.</p>
      <button type="button" id="export-csv">Export CSV</button>
    </section>

    <!-- Chart (added in a later step) -->
    <section class="card">
      <h3>By category</h3>
      <canvas id="chart"></canvas>
      <section class="card filters">
  <select id="filter-category">
    <option value="all">All categories</option>
    <option>Food</option>
    <option>Transport</option>
    <option>Bills</option>
    <option>Shopping</option>
    <option>Entertainment</option>
    <option>Other</option>
  </select>
  <input type="month" id="filter-month" />
  <button type="button" id="clear-filters">Clear</button>
</section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
